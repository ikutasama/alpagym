# @package _global_
# AlpaGym 2-GPU simulation topology: AlPaSim owns physical GPUs 6 and 7.
# Used with 4gpu_sim profile where Cosmos (policy+rollout) runs on GPUs 4,5
# and AlPaSim simulation runs on GPUs 6,7. Capacity = 2 x 4 = 8.

defines:
  nre_cache_size: 16
  physics_cache_size: 16

services:
  renderer:
    environments:
      - OMP_NUM_THREADS=1
      - HOME=/tmp
    replicas_per_container: 1
    gpus: [6, 7]

  driver: null

  physics:
    replicas_per_container: 1
    gpus: [6, 7]

  controller:
    replicas_per_container: 6
    gpus: null

  trafficsim:
    replicas_per_container: 1
    gpus: null

runtime:
  nr_workers: 1
  endpoints:
    # Total capacity per service = nr_gpus x replicas_per_container x n_concurrent_rollouts.
    # REND: 2 x 1 x 4 = 8
    # PHYS: 2 x 1 x 4 = 8
    # CONT: 1 CPU service x 6 x 2 = 12
    renderer:
      n_concurrent_rollouts: 4
    physics:
      n_concurrent_rollouts: 4
      skip: false
    controller:
      n_concurrent_rollouts: 2
      skip: false
    trafficsim:
      skip: true
