# One policy and one rollout worker share GPU 0. Disk replay is required by the
# current colocated Cosmos packer. The external AlpaSim runtime remains on 5011
# and the single Egodriver reverse tunnel remains on 5012.
name: autovla_a100_1gpu_grpo
cuda_visible_devices: "7"
mode: colocated
transport: disk
dp_shard_size: 1

policy_replicas: 1
rollout_replicas: 1

# GRPO: 8 candidates per prompt, 8 samples per training batch.
n_generation: 4
rollout_batch_size: 1
train_batch_per_replica: 4
mini_batch: 1
max_inference_batch_size: 1

# Shorter rollout: 10 valid steps × 0.5s = 5s driving (vs 22×0.5=11s).
# Halves rollout time, doubles training throughput.
max_num_steps: 916
num_epochs: 3
learning_rate: 1.0e-6
warmup_steps: 20
ratio_clip: 0.1
allowed_outdated_steps: 1
save_freq: 30
grad_norm_clip: 1.0
