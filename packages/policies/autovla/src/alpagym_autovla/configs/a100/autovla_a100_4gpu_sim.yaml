# 4-GPU split: 1 policy (GPU 3) + 1 rollout (GPU 4) + 2 AlPaSim (GPUs 5,7).
# Disaggregated mode: policy and rollout on separate GPUs, AlPaSim simulation
# on 2 additional GPUs via alpagym_2sim topology (capacity=8).
# No FSDP CPU offload: 1 replica, model fits on 80GB A100.
# Geometry: n_gen(8) × rollout_batch(1) × rollout_replicas(1) = 8 = policy_replicas(1) × train_batch(8)
name: autovla_a100_4gpu_sim_grpo
cuda_visible_devices: "4,5"
mode: disaggregated
transport: disk
dp_shard_size: 1
alpasim_topology: alpagym_2sim

policy_replicas: 1
rollout_replicas: 1

n_generation: 8
rollout_batch_size: 1
train_batch_per_replica: 8
mini_batch: 2
max_inference_batch_size: 4

max_num_steps: 916
num_epochs: 3
learning_rate: 1.0e-6
warmup_steps: 20
ratio_clip: 0.1
allowed_outdated_steps: 1
save_freq: 30
grad_norm_clip: 1.0
