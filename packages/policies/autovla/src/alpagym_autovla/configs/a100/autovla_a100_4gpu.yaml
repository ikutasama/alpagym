# Disaggregated mode with dp_shard_size=1: policy on one GPU, rollout on another.
# No FSDP — each GPU holds a full model copy. Weight sync via shard-based P2R.
# Matches upstream alpagym's 2-GPU design (alpamayo_1_5_local_2gpu_smoke).
# Uses 4 GPUs: policy_replicas=1 + rollout_replicas=1 = 2 GPUs for cosmos,
# remaining 2 GPUs available for AlPaSim or other tasks.
name: autovla_a100_4gpu_grpo
cuda_visible_devices: "5,7"
mode: disaggregated
transport: disk
dp_shard_size: 1

policy_replicas: 1
rollout_replicas: 1

n_generation: 8
rollout_batch_size: 1
train_batch_per_replica: 8
mini_batch: 2
max_inference_batch_size: 1

max_num_steps: 916
num_epochs: 3
learning_rate: 1.0e-6
warmup_steps: 20
ratio_clip: 0.1
allowed_outdated_steps: 1
save_freq: 30
grad_norm_clip: 1.0
