# 4-GPU disaggregated: 3 policy replicas + 1 rollout replica.
# No FSDP (dp_shard_size=1), each GPU holds full model (~6GB).
# Matches upstream alpagym's multi-GPU design.
# Geometry: n_gen(8) × rollout_batch(3) × rollout_replicas(1) = 24 = policy_replicas(3) × train_batch(8)
name: autovla_a100_4gpu_grpo
cuda_visible_devices: "4,5,6,7"
mode: disaggregated
transport: disk
dp_shard_size: 1

policy_replicas: 3
rollout_replicas: 1

n_generation: 8
rollout_batch_size: 3
train_batch_per_replica: 8
mini_batch: 2
max_inference_batch_size: 3

max_num_steps: 916
num_epochs: 3
learning_rate: 1.0e-6
warmup_steps: 20
ratio_clip: 0.1
allowed_outdated_steps: 1
save_freq: 30
grad_norm_clip: 1.0
