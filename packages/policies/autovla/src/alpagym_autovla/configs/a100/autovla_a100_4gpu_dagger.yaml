# 4-GPU disaggregated DAgger: 3 policy replicas + 1 rollout replica.
# GPU 2: expert service (Alpamayo, ~22GB, outside launcher)
# GPU 3-5: 3 policy replicas (each ~59GB, full 80GB available)
# GPU 6: rollout (vLLM, batch=3, gpu_memory_utilization=0.5)
#
# The 5090's 1gpu topology supports 4 concurrent sim sessions. With
# rollout_batch_size=3 and max_inference_batch_size=3, the rollout GPU
# runs 3 episodes in parallel, batching their drive() calls into single
# forward passes. 3 policy replicas train the 3 episodes in parallel.
#
# Cosmos-RL launcher requires 1, 2, 4, or 8 GPUs per node (5 is rejected).
#
# Geometry: rollout_batch(3) x n_gen(1) x rollout_replicas(1) = 3
#         = policy_replicas(3) x train_batch_per_replica(1)
#
# Expected: ~5 min/step for 3 episodes = ~1.7 min/episode (3.2x vs 2gpu_dagger)
name: autovla_a100_4gpu_dagger
cuda_visible_devices: "3,4,5,6"
mode: disaggregated
transport: disk
dp_shard_size: 1
alpasim_topology: 1gpu

policy_replicas: 3
rollout_replicas: 1

n_generation: 1
rollout_batch_size: 3
train_batch_per_replica: 1
mini_batch: 1
max_inference_batch_size: 3

max_num_steps: 916
num_epochs: 3
learning_rate: 1.0e-6
warmup_steps: 20
ratio_clip: 0.1
allowed_outdated_steps: 1
save_freq: 30
grad_norm_clip: 1.0
